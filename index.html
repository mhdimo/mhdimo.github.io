        body {
            font-family: 'Noto Sans SC', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;

        /* Hide scrollbar but keep functionality */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;

        }
